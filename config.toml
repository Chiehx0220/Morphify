parallel-jobs = 1

[YouTube]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomIcon=icons/YouTube/branding -OcustomName=Morphe"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = []

[YouTube-Experimental]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomIcon=icons/YouTube/branding -OcustomName=Morphe"
version = "exp"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = []

[Music]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomIcon=icons/Music/branding -OcustomName='Morphe Music'"
arch = "both"

[Music.patches]
"github:MorpheApp/morphe-patches" = []

[Music-Experimental]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomIcon=icons/Music/branding -OcustomName='Morphe Music'"
arch = "both"
version = "exp"

[Music-Experimental.patches]
"github:MorpheApp/morphe-patches" = []

[Reddit]
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
patcher-args = "-e 'Custom branding name for Reddit' -OappName='Morphe Reddit'"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = []

[Reddit-Experimental]
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
patcher-args = "-e 'Custom branding name for Reddit' -OappName='Morphe Reddit'"
version = "exp"

[Reddit-Experimental.patches]
"github:MorpheApp/morphe-patches" = []

[X]
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
brand = "Piko"

[X.patches]
"github:crimera/piko" = ["Browse tweet object", "Dynamic color"]

[Twitter]
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
brand = "Piko"

[Twitter.patches]
"github:crimera/piko" = ["Bring back twitter", "Browse tweet object", "Dynamic color"]

[Instagram]
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
patcher-args = "-e 'Theme' -Oamoled=true"
brand = "Piko"
arch = "arm64-v8a"

[Instagram.patches]
"github:crimera/piko" = []